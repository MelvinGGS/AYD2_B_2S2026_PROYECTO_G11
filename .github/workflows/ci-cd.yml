name: CI/CD Pipeline - MegaStore SGO-Logic (Fase 3)

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main

# Cancela ejecuciones anteriores si haces un nuevo push rápido a la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ETAPA 1: BUILD (Compilación y generación de artefactos)
  build:
    name: Build Frontend & Microservicios
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 1. Frontend React (Vite)
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fase3/frontend/package-lock.json

      - name: Compilar Frontend React SPA
        working-directory: fase3/frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      # 2. Backends Java 17 Spring Boot
      - name: Configurar Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: 'fase3/**/pom.xml'

      - name: Compilar Microservicios Java en paralelo
        run: |
          mvn -B compile -f fase3/ordenes-service/pom.xml &
          mvn -B compile -f fase3/inventario-service/pom.xml &
          mvn -B compile -f fase3/pagos-service/pom.xml &
          mvn -B compile -f fase3/facturacion-service/pom.xml &
          wait

      # 3. Backends .NET 8
      - name: Configurar .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cachear paquetes NuGet (.NET)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('fase3/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Compilar Microservicios .NET 8 en paralelo
        run: |
          dotnet build fase3/logistica-service/logistica-service.csproj --nologo &
          dotnet build fase3/notificaciones-service/notificaciones-service.csproj --nologo &
          wait

  # ETAPA 2: TEST (Pruebas automáticas - Compuerta de calidad)
  test:
    name: Automated Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 (con caché)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fase3/frontend/package-lock.json

      - name: Ejecutar Pruebas Unitarias Frontend (Checkout & BNPL)
        working-directory: fase3/frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm test

      - name: Configurar Java JDK 17 (con caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: 'fase3/**/pom.xml'

      - name: Ejecutar Pruebas Backend Java
        run: |
          mvn -B test -f fase3/pagos-service/pom.xml &
          mvn -B test -f fase3/inventario-service/pom.xml &
          wait

      - name: Configurar .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Recuperar caché NuGet (.NET)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('fase3/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Ejecutar Pruebas de Integración Logística (.NET 8 xUnit)
        run: |
          dotnet test fase3/logistica-service.Tests/logistica-service.Tests.csproj --nologo --logger "console;verbosity=normal"

  # ETAPA 3: DEPLOY (Despliegue automatizado)
  deploy:
    name: Deploy to Production Environment
    needs: test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Desplegar vía SSH
        if: env.SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" << 'EOF'
            set -e
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            if [ -d "/opt/megastore" ]; then
              cd /opt/megastore
            else
              cd /home/${USER}/AYD2_B_2S2026_PROYECTO_G11
            fi
            git pull origin develop
            cd fase3
            docker compose build frontend
            docker compose up -d
            echo "Despliegue completado exitosamente en Compute Engine."
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      - name: Verificación de estado del despliegue
        if: env.SSH_HOST == ''
        run: |
          echo "Deploy step skipped: SSH_HOST secret is not configured."

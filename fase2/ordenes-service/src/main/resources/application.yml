server:
  port: 8081

spring:
  application:
    name: ordenes-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgologic}
    username: ${SPRING_DATASOURCE_USERNAME:sgologic}
    password: ${SPRING_DATASOURCE_PASSWORD:sgologic2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: sgologic.exchange
    routing-key-orden-creada: orden.creada
    queue-notificaciones: notificaciones.queue

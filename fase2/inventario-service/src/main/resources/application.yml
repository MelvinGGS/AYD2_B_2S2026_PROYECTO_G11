server:
  port: 8082

spring:
  application:
    name: inventario-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgologic}
    username: ${SPRING_DATASOURCE_USERNAME:sgologic}
    password: ${SPRING_DATASOURCE_PASSWORD:sgologic2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: sgologic.exchange
    routing-key-inventario-reservado: inventario.reservado
    queue-ordenes-para-inventario: inventario.orden.queue
